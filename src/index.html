<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Camera OCR</title>
<!-- GitHub Pages không đặt được header COOP/COEP; service worker này thêm vào để ONNX Runtime chạy đa luồng -->
<script src="coi-serviceworker.min.js"></script>
<style>
  :root {
    --bg: #0f1214; --panel: #171c1f; --line: #2a3237; --fg: #e8eef0; --muted: #8b989e;
    --accent: #ffb547; --ok: #5fd39a; --err: #ff6b6b; --scrim: rgba(0,0,0,.5);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
    user-select: none; -webkit-user-select: none;
  }
  button, select { font: inherit; color: var(--fg); cursor: pointer; touch-action: manipulation; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .4; }

  /* ---------- Camera: chiếm phần trên màn hình, mọi nút đè lên trên ---------- */
  .stage { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: calc(var(--sat) + 10px) max(12px, var(--sar)) 24px max(12px, var(--sal));
    background: linear-gradient(var(--scrim), transparent);
  }
  .topbar h1 { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; font-size: 15px; font-weight: 600; text-shadow: 0 1px 2px #000; }
  .chip {
    height: 40px; min-width: 40px; padding: 0 12px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.45);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  select.chip { appearance: none; -webkit-appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--fg) 50%), linear-gradient(135deg, var(--fg) 50%, transparent 50%); background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat; background-color: rgba(0,0,0,.45); }
  .chip[aria-pressed="true"] { background-color: var(--accent); color: #1a1205; border-color: var(--accent); }
  .chip svg { width: 20px; height: 20px; }

  /* Vùng quét: chỉ phần trong khung được đưa vào OCR */
  .roi {
    position: absolute; left: 7%; right: 7%; top: 50%; height: 26%; transform: translateY(-55%);
    border-radius: 14px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.42); pointer-events: none;
  }
  .roi::before, .roi::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
  .roi::before { border: 2px solid rgba(255,255,255,.25); }
  /* góc khung kiểu ống ngắm */
  .roi::after {
    --c: var(--accent); --l: 26px; --w: 4px;
    background:
      linear-gradient(var(--c), var(--c)) top left / var(--l) var(--w),
      linear-gradient(var(--c), var(--c)) top left / var(--w) var(--l),
      linear-gradient(var(--c), var(--c)) top right / var(--l) var(--w),
      linear-gradient(var(--c), var(--c)) top right / var(--w) var(--l),
      linear-gradient(var(--c), var(--c)) bottom left / var(--l) var(--w),
      linear-gradient(var(--c), var(--c)) bottom left / var(--w) var(--l),
      linear-gradient(var(--c), var(--c)) bottom right / var(--l) var(--w),
      linear-gradient(var(--c), var(--c)) bottom right / var(--w) var(--l);
    background-repeat: no-repeat;
  }
  .scanline { position: absolute; left: 4%; right: 4%; height: 2px; top: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); opacity: 0; }
  .roi.busy .scanline { opacity: 1; animation: scan 1.1s ease-in-out infinite alternate; }
  @keyframes scan { from { top: 8%; } to { top: 92%; } }
  @media (prefers-reduced-motion: reduce) { .roi.busy .scanline { animation: none; } }
  .boxes { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: inherit; transition: opacity .4s; }
  .boxes.fade { opacity: 0; }
  .hint { position: absolute; left: 0; right: 0; top: calc(100% + 10px); text-align: center; font-size: 13px; color: rgba(255,255,255,.85); text-shadow: 0 1px 2px #000; }

  .shutterbar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
    padding: 28px max(20px, var(--sar)) 16px max(20px, var(--sal));
    background: linear-gradient(transparent, var(--scrim));
  }
  .shutterbar .left { justify-self: start; } .shutterbar .right { justify-self: end; }
  .shutter {
    width: 76px; height: 76px; border-radius: 50%; padding: 0;
    border: 4px solid #fff; background: transparent; display: grid; place-items: center;
  }
  .shutter::after { content: ""; width: 60px; height: 60px; border-radius: 50%; background: var(--accent); transition: transform .12s; }
  .shutter:active::after { transform: scale(.88); }
  .shutter.busy::after { animation: pulse .9s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.8); opacity: .6; } }
  .chip.big { height: 48px; min-width: 48px; border-radius: 24px; font-size: 14px; }

  /* ---------- Ô kết quả: nửa dưới, kéo/chạm để mở rộng ---------- */
  .sheet {
    flex: 0 0 auto; height: 34dvh; min-height: 170px; display: flex; flex-direction: column;
    background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; margin-top: -16px; z-index: 3;
    padding-bottom: var(--sab); transition: height .25s ease;
  }
  .sheet.expanded { height: 72dvh; }
  .grip { align-self: center; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px 0 2px; border: 0; padding: 0; }
  .grip-hit { display: flex; justify-content: center; background: none; border: 0; padding: 0 0 4px; width: 100%; }
  .sheet-head { display: flex; align-items: center; gap: 8px; padding: 2px max(14px, var(--sar)) 8px max(14px, var(--sal)); }
  .status { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .status.err { color: var(--err); } .status.ok { color: var(--ok); }
  .btn { height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
  .bar { height: 2px; background: var(--line); margin: 0 max(14px, var(--sar)) 0 max(14px, var(--sal)); border-radius: 1px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  textarea {
    flex: 1; min-height: 0; width: 100%; resize: none; border: 0; outline: none; background: transparent; color: var(--fg);
    /* 16px để iOS/Android không tự zoom khi chạm vào */
    font: 16px/1.55 var(--mono); padding: 12px max(14px, var(--sar)) 12px max(14px, var(--sal));
    user-select: text; -webkit-user-select: text;
  }
  textarea::placeholder { color: var(--muted); }

  .toast {
    position: fixed; left: 50%; bottom: calc(34dvh + 16px); transform: translate(-50%, 8px); z-index: 10;
    background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 18px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .fallback { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; color: var(--muted); }
  .fallback.show { display: flex; }
  .fallback .btn { height: 48px; background: var(--accent); color: #1a1205; border: 0; font-weight: 600; }

  /* Điện thoại xoay ngang: camera bên trái, kết quả bên phải */
  @media (orientation: landscape) and (max-height: 540px) {
    body { flex-direction: row; }
    .sheet, .sheet.expanded { height: auto; width: 40vw; min-height: 0; margin: 0; border-radius: 0; border-top: 0; border-left: 1px solid var(--line); padding-top: var(--sat); }
    .grip-hit { display: none; }
    .shutterbar { padding-bottom: calc(var(--sab) + 10px); }
    .roi { height: 34%; }
    .toast { bottom: 24px; left: 30vw; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>

    <div class="topbar">
      <h1>Camera OCR</h1>
      <select id="engine" class="chip" aria-label="Bộ nhận dạng">
        <option value="paddle">PaddleOCR</option>
        <option value="tesseract">Tesseract</option>
      </select>
      <select id="lang" class="chip" aria-label="Ngôn ngữ Tesseract" hidden>
        <option value="eng">English</option>
        <option value="vie+eng">Việt + Anh</option>
      </select>
      <button class="chip" id="torch" aria-pressed="false" aria-label="Đèn flash" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h10l-2 7h3l-8 13 1-9H7z"/></svg>
      </button>
    </div>

    <div class="roi" id="roi"><canvas class="boxes" id="boxes"></canvas><div class="scanline"></div><div class="hint">Đưa dòng chữ vào trong khung</div></div>

    <div class="shutterbar">
      <button class="chip big left" id="auto" aria-pressed="false" disabled>Tự động</button>
      <button class="shutter" id="snap" aria-label="Chụp và đọc chữ" disabled></button>
      <button class="chip big right" id="flip" aria-label="Đổi camera" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-2-3H9L7 7H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9 13a3 3 0 0 1 5-2.2M15 13a3 3 0 0 1-5 2.2"/><path d="M14 9v2h-2M10 17v-2h2"/></svg>
      </button>
    </div>

    <div class="fallback" id="fallback">
      <div>Không mở được camera trực tiếp<br><small id="why"></small></div>
      <button class="btn" type="button" onclick="document.getElementById('file').click()">Chụp ảnh để đọc chữ</button>
      <input type="file" id="file" accept="image/*" capture="environment" hidden>
    </div>
  </main>

  <section class="sheet" id="sheet">
    <button class="grip-hit" id="grip" aria-label="Mở rộng khung kết quả"><span class="grip"></span></button>
    <div class="sheet-head">
      <span class="status" id="status">Đang khởi động…</span>
      <button class="btn" id="clear">Xóa</button>
      <button class="btn" id="copy">Sao chép</button>
    </div>
    <div class="bar"><i id="progress"></i></div>
    <textarea id="out" placeholder="Bấm nút tròn để đọc chữ trong khung. Kết quả hiện ở đây." spellcheck="false"></textarea>
  </section>

  <div class="toast" id="toast" role="status"></div>

<script src="tesseract.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const video = $('video'), statusEl = $('status'), bar = $('progress');
let worker = null, workerLang = null, stream = null, facing = 'environment', busy = false, autoTimer = null, wakeLock = null;

function setStatus(msg, kind = '') { statusEl.textContent = msg; statusEl.className = 'status ' + kind; }

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

// Mọi file runtime được phục vụ cùng trang, không phụ thuộc CDN.
async function getWorker(lang) {
  if (worker && workerLang === lang) return worker;
  if (worker) await worker.terminate();
  setStatus(`Đang tải mô hình ${lang}…`);
  const base = new URL('.', location.href).href;
  worker = await Tesseract.createWorker(lang.split('+'), 1, {
    workerPath: base + 'worker.min.js',
    corePath: base + 'core/',
    langPath: base + 'lang',
    logger: (m) => { if (typeof m.progress === 'number') bar.style.width = Math.round(m.progress * 100) + '%'; },
  });
  workerLang = lang;
  setStatus('Sẵn sàng, bấm nút tròn để đọc');
  return worker;
}

// PaddleOCR: tải ONNX Runtime + mô hình khi chọn lần đầu (~30 MB, trình duyệt cache lại)
let paddle = null;
function getPaddle() {
  paddle ??= (async () => {
    const base = new URL('.', location.href).href;
    const [ort, { createPaddleOCR }] = await Promise.all([import(base + 'ort/ort.wasm.min.mjs'), import(base + 'paddle.js')]);
    ort.env.wasm.wasmPaths = base + 'ort/';
    // GitHub Pages không bật cross-origin isolation nên không chạy đa luồng được
    ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 1) : 1;
    const loaded = {};
    const load = async (name, as) => {
      const res = await fetch(base + 'models/' + name);
      if (!res.ok) throw new Error(`Không tải được ${name} (HTTP ${res.status})`);
      if (as === 'text') return res.text();
      // Đọc theo luồng để hiện % tải
      const total = Number(res.headers.get('content-length')) || 0, reader = res.body.getReader(), parts = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value); got += value.length; loaded[name] = [got, total];
        const [g, t] = Object.values(loaded).reduce((a, [x, y]) => [a[0] + x, a[1] + y], [0, 0]);
        if (t) { bar.style.width = Math.round((g / t) * 100) + '%'; setStatus(`Đang tải PaddleOCR ${(g / 1e6).toFixed(1)}/${(t / 1e6).toFixed(1)} MB`); }
      }
      const buf = new Uint8Array(got);
      let o = 0; for (const p of parts) { buf.set(p, o); o += p.length; }
      return buf;
    };
    setStatus('Đang tải PaddleOCR…');
    const ocr = await createPaddleOCR({
      ort, load,
      det: 'ch_PP-OCRv4_det_infer.onnx', rec: 'ch_PP-OCRv4_rec_infer.onnx', dict: 'ppocr_keys_v1.txt',
      allow: /^[\x20-\x7E°±µΩ×]$/, // tem tiếng Anh: chỉ nhận chữ Latin, số và ký hiệu
    });
    setStatus('Sẵn sàng, bấm nút tròn để đọc');
    return ocr;
  })().catch((e) => { paddle = null; throw e; });
  return paddle;
}

const engine = () => $('engine').value;
function prepareEngine() {
  $('lang').hidden = engine() !== 'tesseract';
  const p = engine() === 'paddle' ? getPaddle() : getWorker($('lang').value);
  return p.catch((e) => setStatus('Lỗi tải ' + engine() + ': ' + (e.message || e), 'err'));
}

// Khoanh các vùng chữ Paddle tìm được lên khung ngắm, mờ dần sau 1,5 giây
let boxTimer;
function drawBoxes(items, srcW, srcH) {
  const cv = $('boxes'), r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const ctx = cv.getContext('2d'), kx = cv.width / srcW, ky = cv.height / srcH;
  ctx.lineWidth = 2 * dpr; ctx.strokeStyle = '#5fd39a'; ctx.fillStyle = 'rgba(95,211,154,.15)';
  for (const it of items) {
    const x = it.x0 * kx, y = it.y0 * ky, w = (it.x1 - it.x0) * kx, h = (it.y1 - it.y0) * ky;
    ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
  }
  cv.classList.remove('fade');
  clearTimeout(boxTimer); boxTimer = setTimeout(() => cv.classList.add('fade'), 1500);
}

// Ảnh chọn từ thư viện/camera hệ thống -> canvas (giới hạn 1600px cho nhanh)
async function fileToCanvas(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}

async function startCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  if (!navigator.mediaDevices?.getUserMedia) throw new Error(window.isSecureContext ? 'Trình duyệt không hỗ trợ camera' : 'Trang phải mở qua HTTPS');
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    audio: false,
  });
  video.srcObject = stream;
  video.style.transform = facing === 'user' ? 'scaleX(-1)' : '';
  await video.play();
  // Đèn flash chỉ có trên camera sau của một số máy Android
  const caps = stream.getVideoTracks()[0].getCapabilities?.() || {};
  $('torch').hidden = !caps.torch;
  $('torch').setAttribute('aria-pressed', 'false');
}

async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && stream) keepAwake(); });

// Cắt đúng vùng khung theo tỉ lệ hiển thị (video dùng object-fit: cover); cho Tesseract thì chuyển xám và tăng tương phản.
function grabRoi(gray = true) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const box = video.getBoundingClientRect(), roi = $('roi').getBoundingClientRect();
  const scale = Math.max(box.width / vw, box.height / vh);
  const offX = (vw * scale - box.width) / 2, offY = (vh * scale - box.height) / 2;
  let sx = (roi.left - box.left + offX) / scale;
  const sy = (roi.top - box.top + offY) / scale;
  const sw = roi.width / scale, sh = roi.height / scale;
  if (facing === 'user') sx = vw - sx - sw; // camera trước đang hiển thị lật gương

  // ~1000px chiều ngang là đủ nét cho OCR; ảnh lớn hơn chỉ làm điện thoại chậm đi nhiều lần
  const k = Math.min(2, 1000 / sw);
  const c = document.createElement('canvas');
  c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
  if (!gray) return c; // PaddleOCR được huấn luyện trên ảnh màu, không cần xử lý thêm
  const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    const v = Math.max(0, Math.min(255, (g - 128) * 1.4 + 128));
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

async function recognize(source, fromRoi = true) {
  if (busy) return;
  busy = true; $('roi').classList.add('busy'); $('snap').classList.add('busy');
  try {
    let text, confidence, detail = '';
    if (engine() === 'paddle') {
      const ocr = await getPaddle();
      setStatus('Paddle đang đọc…');
      const img = source.getContext('2d').getImageData(0, 0, source.width, source.height);
      const r = await ocr.recognize(img);
      ({ text, confidence } = r);
      detail = ` · tìm ${r.timing.det} + đọc ${r.timing.rec} ms`;
      if (fromRoi) drawBoxes(r.items, source.width, source.height);
    } else {
      const w = await getWorker($('lang').value);
      setStatus('Tesseract đang đọc…');
      const t0 = performance.now();
      const { data } = await w.recognize(source);
      ({ text, confidence } = data);
      detail = ` · ${Math.round(performance.now() - t0)} ms`;
    }
    text = text.trim();
    if (text) {
      $('out').value = text;
      setStatus(`${Math.round(confidence)}%${detail}`, 'ok');
      navigator.vibrate?.(30);
    } else {
      setStatus(`Không thấy chữ trong khung${detail}`);
    }
  } catch (e) {
    setStatus('Lỗi: ' + (e.message || e), 'err');
  } finally {
    busy = false; $('roi').classList.remove('busy'); $('snap').classList.remove('busy');
  }
}

const snap = () => { if (video.videoWidth) recognize(grabRoi(engine() === 'tesseract')); };
$('snap').onclick = () => (video.videoWidth ? snap() : toast('Camera chưa sẵn sàng'));

$('auto').onclick = () => {
  const on = $('auto').getAttribute('aria-pressed') !== 'true';
  $('auto').setAttribute('aria-pressed', on);
  clearInterval(autoTimer);
  if (on) { autoTimer = setInterval(() => { if (!busy) snap(); }, 1200); toast('Đang quét liên tục'); }
  else toast('Đã tắt quét liên tục');
};

$('flip').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await startCamera(); } catch (e) { setStatus('Lỗi camera: ' + e.message, 'err'); }
};

$('torch').onclick = async () => {
  const on = $('torch').getAttribute('aria-pressed') !== 'true';
  try {
    await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: on }] });
    $('torch').setAttribute('aria-pressed', on);
  } catch { toast('Máy này không bật được đèn từ trình duyệt'); }
};

$('lang').onchange = () => prepareEngine();

$('engine').onchange = () => {
  try { localStorage.setItem('ocr-engine', engine()); } catch {}
  prepareEngine();
};
try { const saved = localStorage.getItem('ocr-engine'); if (saved) $('engine').value = saved; } catch {}

$('copy').onclick = async () => {
  if (!$('out').value) return toast('Chưa có chữ để sao chép');
  try { await navigator.clipboard.writeText($('out').value); toast('Đã sao chép'); }
  catch { $('out').select(); toast('Đã chọn sẵn, hãy bấm Copy'); }
};

$('clear').onclick = () => { $('out').value = ''; setStatus('Đã xóa'); };

$('grip').onclick = () => $('sheet').classList.toggle('expanded');

// Vuốt lên/xuống trên thanh kéo để mở rộng/thu nhỏ ô kết quả
let touchY = null;
$('grip').addEventListener('touchstart', (e) => { touchY = e.touches[0].clientY; }, { passive: true });
$('grip').addEventListener('touchend', (e) => {
  if (touchY === null) return;
  const dy = e.changedTouches[0].clientY - touchY; touchY = null;
  if (Math.abs(dy) > 30) { e.preventDefault(); $('sheet').classList.toggle('expanded', dy < 0); }
});

$('file').onchange = async (e) => { const f = e.target.files[0]; if (f) recognize(await fileToCanvas(f), false); };

(async () => {
  try {
    await startCamera();
    ['snap', 'auto', 'flip'].forEach((id) => ($(id).disabled = false));
    keepAwake();
  } catch (e) {
    $('why').textContent = e.message || e.name;
    $('fallback').classList.add('show');
    ['roi', 'video'].forEach((id) => ($(id).hidden = true));
    document.querySelector('.shutterbar').hidden = true;
  }
  prepareEngine();
})();
</script>
</body>
</html>
